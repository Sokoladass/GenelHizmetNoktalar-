<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Başakşehir Totem LED Ekran Yerleşim Önerisi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --navy:#0B1F3A;
    --navy-light:#142A4D;
    --teal:#1C7293;
    --cyan:#00C2D1;
    --bg:#F4F7FA;
    --white:#FFFFFF;
    --text:#1C2530;
    --muted:#6B7787;
    --border:#E2E8F0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);}
  #app{height:100vh;display:flex;flex-direction:column;}

  /* ---------- HEADER ---------- */
  .topbar{
    background:var(--navy);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    flex-shrink:0;
    gap:20px;
    z-index:500;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand-mark{
    display:grid;
    grid-template-columns:repeat(3,8px);
    grid-template-rows:repeat(3,8px);
    gap:3px;
    flex-shrink:0;
  }
  .brand-mark span{display:block;width:8px;height:8px;border-radius:2px;background:var(--cyan);}
  .brand-mark span:nth-child(1){opacity:.35;}
  .brand-mark span:nth-child(2){opacity:.9;}
  .brand-mark span:nth-child(3){opacity:.5;}
  .brand-mark span:nth-child(4){opacity:.6;}
  .brand-mark span:nth-child(5){opacity:1;}
  .brand-mark span:nth-child(6){opacity:.4;}
  .brand-mark span:nth-child(7){opacity:.5;}
  .brand-mark span:nth-child(8){opacity:.8;}
  .brand-mark span:nth-child(9){opacity:.3;}
  .brand-text h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;line-height:1.25;}
  .brand-text p{font-size:12px;margin:2px 0 0;color:#9FB3CC;}
  .stats{display:flex;gap:22px;flex-shrink:0;}
  .stat{text-align:center;}
  .stat strong{display:block;font-size:20px;font-weight:700;color:var(--cyan);}
  .stat span{display:block;font-size:10.5px;color:#9FB3CC;text-transform:uppercase;letter-spacing:.5px;margin-top:1px;}
  .btn-ghost{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--white);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.18);}
  .btn-ghost:focus-visible, .chip:focus-visible, .cat-row:focus-visible, .loc-card:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  /* ---------- LAYOUT ---------- */
  .layout{flex:1;display:flex;min-height:0;}
  #sidebar{
    width:340px;
    background:var(--white);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:margin-left .25s ease;
  }
  #sidebar.collapsed{margin-left:-340px;}
  #mapWrap{flex:1;position:relative;min-width:0;}
  #map{position:absolute;inset:0;}

  /* ---------- SIDEBAR CONTENT ---------- */
  .search-box{padding:16px 16px 8px;}
  .search-box input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13.5px;
    background:var(--bg);
    color:var(--text);
  }
  .search-box input:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  .coord-box{display:flex;gap:6px;padding:0 16px 14px;}
  .coord-box input{
    flex:1;min-width:0;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:12.5px;
    background:var(--bg);
    color:var(--text);
  }
  .coord-box input:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  .coord-box input.coord-error{border-color:#C92A2A;background:#FFF1F1;}
  .coord-go-btn{
    background:var(--navy);color:var(--white);border:none;
    border-radius:8px;padding:0 14px;font-size:12.5px;font-weight:700;
    cursor:pointer;flex-shrink:0;
  }
  .coord-go-btn:hover{background:var(--navy-light);}
  .coord-hint{font-size:10.5px;color:var(--muted);padding:0 16px 10px;margin-top:-8px;}
  .filter-group{padding:10px 16px;border-bottom:1px solid var(--border);}
  .filter-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:700;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border);
    background:var(--white);
    color:var(--text);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip.active{background:var(--navy);color:var(--white);border-color:var(--navy);}
  #categoryList{display:flex;flex-direction:column;gap:6px;}
  .cat-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 8px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
    user-select:none;
  }
  .cat-row:hover{background:var(--bg);}
  .cat-row.inactive{opacity:.4;}
  .cat-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .cat-dot svg{display:block;}
  .cat-label{flex:1;}
  .cat-count{font-size:11.5px;color:var(--muted);font-weight:600;}
  .location-list{flex:1;overflow-y:auto;padding:8px 12px 16px;}
  .list-meta{font-size:11.5px;color:var(--muted);padding:4px 8px 8px;}
  .loc-card{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 11px;
    margin-bottom:7px;
    cursor:pointer;
    background:var(--white);
    transition:border-color .15s ease, background .15s ease;
  }
  .loc-card:hover{border-color:var(--teal);background:var(--bg);}
  .loc-top{display:flex;align-items:flex-start;gap:8px;}
  .loc-dot{width:20px;height:20px;border-radius:50%;margin-top:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .loc-dot svg{display:block;}
  .loc-name{font-size:13.5px;font-weight:700;line-height:1.3;}
  .loc-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .loc-badges{display:flex;gap:6px;margin-top:6px;}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--bg);color:var(--muted);}
  .empty-state{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;}

  /* ---------- MAP OVERLAYS ---------- */
  .map-legend{
    position:absolute;
    bottom:18px;
    left:18px;
    background:rgba(255,255,255,0.96);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:12px;
    box-shadow:0 4px 14px rgba(11,31,58,0.12);
    z-index:400;
    max-width:230px;
  }
  .map-legend h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .map-legend .leg-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .map-legend .leg-row:last-child{margin-bottom:0;}
  .map-legend .cat-dot{width:18px;height:18px;}

  .pin-popup .leaflet-popup-content-wrapper{border-radius:10px;}
  .pin-popup .leaflet-popup-content{margin:14px 16px;min-width:210px;}
  .pp-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .pp-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pp-title{font-size:14px;font-weight:700;margin:0;}
  .pp-row{font-size:12px;color:var(--muted);margin:2px 0;}
  .pp-row b{color:var(--text);}
  .pp-suggestion{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--border);
    font-size:12px;
  }
  .pp-sugg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .pp-sugg-head b{color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .pp-edited-tag{font-size:10px;font-weight:600;color:var(--muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:6px;}
  .pp-edit-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);
    padding:3px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .pp-edit-btn:hover{color:var(--teal);background:var(--bg);}
  .pp-sugg-text{color:var(--text);line-height:1.4;}
  .pp-edit-textarea{
    width:100%;border:1px solid var(--border);border-radius:7px;
    padding:7px 8px;font-size:12.5px;font-family:inherit;color:var(--text);
    resize:vertical;margin-top:2px;
  }
  .pp-edit-textarea:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  .pp-edit-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pp-btn{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;color:var(--text);}
  .pp-btn-save{background:var(--navy);color:var(--white);border-color:var(--navy);}
  .pp-btn-save:hover{background:var(--navy-light);}
  .pp-btn-cancel:hover{background:var(--bg);}
  .pp-btn-reset{color:var(--muted);margin-left:auto;}
  .pp-btn-reset:hover{color:var(--text);background:var(--bg);}
  .pp-btn-delete{color:#C92A2A;border-color:#F1C2C2;}
  .pp-btn-delete:hover{background:#FFF1F1;}
  .pp-icon-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);
    padding:3px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .pp-icon-btn:hover{color:#C92A2A;background:#FFF1F1;}
  .pp-head-actions{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0;}
  .pp-custom-tag{font-size:10px;font-weight:600;color:var(--muted);font-style:italic;margin-left:6px;}
  .pp-field{margin-bottom:8px;}
  .pp-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .pp-input, .pp-select{
    width:100%;border:1px solid var(--border);border-radius:7px;
    padding:7px 8px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--white);
  }
  .pp-input:focus, .pp-select:focus{outline:2px solid var(--cyan);outline-offset:1px;}

  .add-mode-banner{
    position:absolute;
    top:16px;left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--white);
    padding:10px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 6px 18px rgba(11,31,58,0.3);
    z-index:450;
  }
  .add-mode-banner button{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--white);
    font-size:12px;
    font-weight:600;
    padding:4px 10px;
    border-radius:14px;
    cursor:pointer;
  }
  .add-mode-banner button:hover{background:rgba(255,255,255,0.28);}
  #map.add-mode-cursor{cursor:crosshair;}

  .target-pin{width:34px;height:34px;position:relative;display:flex;align-items:center;justify-content:center;}
  .target-pin-dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,194,209,0.45);z-index:2;}
  .target-pin-ring{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(0,194,209,0.35);animation:pulse-ring 1.4s ease-out infinite;}
  @keyframes pulse-ring{
    0%{transform:scale(0.3);opacity:0.85;}
    100%{transform:scale(1.5);opacity:0;}
  }

  .divpin{
    width:28px;height:28px;border-radius:50%;
    border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
  }
  .divpin svg{display:block;}

  @media (max-width: 880px){
    #sidebar{position:absolute;top:0;left:0;height:100%;z-index:600;width:86vw;max-width:340px;box-shadow:0 0 24px rgba(0,0,0,0.25);}
    #sidebar.collapsed{margin-left:-86vw;}
    .stats{display:none;}
  }

  @media print{
    .topbar .btn-ghost, #sidebar{display:none !important;}
    #app, .layout{height:100vh;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <div class="brand-text">
        <h1>Totem LED Ekran Yerleşim Önerisi</h1>
        <p>Başakşehir Belediyesi · Proje Koordinasyon Birimi</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="statTotal">59</strong><span>Nokta</span></div>
      <div class="stat"><strong id="statVisible">59</strong><span>Görünen</span></div>
    </div>
    <button class="btn-ghost" id="addPinBtn">+ Nokta Ekle</button>
    <button class="btn-ghost" id="downloadBtn">Güncel Halini İndir</button>
    <button class="btn-ghost" id="toggleSidebar">Sunum Modu</button>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Nokta veya mahalle ara…">
      </div>
      <div class="coord-box">
        <input id="coordInput" type="text" placeholder="Koordinat yapıştır (örn. 41.0082, 28.9784)">
        <button type="button" class="coord-go-btn" id="coordGoBtn">Git</button>
      </div>
      <div class="coord-hint">Google Maps'ten kopyaladığınız koordinatı veya bağlantıyı buraya yapıştırabilirsiniz</div>

      <div class="filter-group">
        <h3>Kategori</h3>
        <div id="categoryList"></div>
      </div>

      <div class="list-meta" id="listMeta"></div>
      <div class="location-list" id="locationList"></div>
    </aside>

    <main id="mapWrap">
      <div id="map"></div>
      <div class="map-legend" id="mapLegend"></div>
      <div class="add-mode-banner" id="addModeBanner" style="display:none;">
        <span>Haritada bir noktaya tıklayarak yeni pin ekleyin</span>
        <button type="button" id="cancelAddMode">Vazgeç</button>
      </div>
    </main>
  </div>
</div>

<script>
/* Dışa aktarma (indirme) için sayfanın ilk/temiz halini en başta saklıyoruz */
const ORIGINAL_SOURCE = document.documentElement.outerHTML;

/* ======================= DATA ======================= */
const CATS = {
  metro:        { label: "Toplu Taşıma (Metro)",        color: "#2E86AB" },
  yesil:        { label: "Yeşil Alan & Spor",            color: "#2F9E44" },
  kamu:         { label: "Kamu, Kültür & Gençlik",       color: "#7048E8" },
  ticaret:      { label: "Ticaret (AVM / Pazar)",        color: "#F08C00" },
  sosyal:       { label: "Sosyal Alan (Meydan/Cami/Mahalle)", color: "#E64980" },
  egitim_saglik:{ label: "Eğitim & Sağlık",              color: "#FA5252" },
  kavsak:       { label: "Bağlantı Noktası (Kavşak)",    color: "#495057" }
};

const CONTENT_SUGGESTION = {
  metro:        "Yönlendirme tabelası + güncel duyurular",
  yesil:        "Etkinlik duyurusu + gençlik / aile içeriği",
  kamu:         "Resmi duyuru + gençlik programları",
  ticaret:      "Kampanya tanıtımı + genel bilgilendirme",
  sosyal:       "Yerel duyuru + toplumsal etkinlik içeriği",
  egitim_saglik:"Bilgilendirme + yönlendirme",
  kavsak:       "Trafik / yönlendirme + genel duyuru"
};

/* ---- Kategori sembolleri (saf SVG, harici ikon kütüphanesi gerektirmez) ---- */
const ICON_SHAPES = {
  metro: bg => `
    <rect x="4" y="5" width="16" height="10" rx="3" fill="#fff"/>
    <rect x="7" y="7.4" width="4" height="3" rx="0.6" fill="${bg}"/>
    <rect x="13" y="7.4" width="4" height="3" rx="0.6" fill="${bg}"/>
    <circle cx="8" cy="17.3" r="1.7" fill="#fff"/>
    <circle cx="16" cy="17.3" r="1.7" fill="#fff"/>
  `,
  yesil: () => `
    <circle cx="12" cy="9.5" r="6" fill="#fff"/>
    <rect x="10.6" y="14.3" width="2.8" height="6" rx="1" fill="#fff"/>
  `,
  kamu: bg => `
    <polygon points="12,3 21,9.5 3,9.5" fill="#fff"/>
    <rect x="4" y="9.5" width="16" height="9.5" rx="1" fill="#fff"/>
    <rect x="6.8" y="11" width="1.6" height="6.5" fill="${bg}"/>
    <rect x="11.2" y="11" width="1.6" height="6.5" fill="${bg}"/>
    <rect x="15.6" y="11" width="1.6" height="6.5" fill="${bg}"/>
  `,
  ticaret: () => `
    <path d="M8.5 9 C8.5 5.4 15.5 5.4 15.5 9" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <rect x="5.5" y="9" width="13" height="10.5" rx="1.6" fill="#fff"/>
  `,
  sosyal: () => `
    <rect x="6.4" y="3.5" width="1.8" height="17" rx="0.6" fill="#fff"/>
    <polygon points="8.2,5 18,8.3 8.2,11.6" fill="#fff"/>
  `,
  egitim_saglik: () => `
    <rect x="10" y="5" width="4" height="14" rx="1" fill="#fff"/>
    <rect x="5" y="10" width="14" height="4" rx="1" fill="#fff"/>
  `,
  kavsak: bg => `
    <rect x="9.4" y="1" width="5.2" height="22" rx="1" fill="#fff"/>
    <rect x="1" y="9.4" width="22" height="5.2" rx="1" fill="#fff"/>
    <rect x="11.2" y="1.2" width="1.6" height="2.2" fill="${bg}"/>
    <rect x="11.2" y="4.4" width="1.6" height="2.2" fill="${bg}"/>
    <rect x="11.2" y="7.6" width="1.6" height="1.6" fill="${bg}"/>
    <rect x="11.2" y="14.8" width="1.6" height="1.6" fill="${bg}"/>
    <rect x="11.2" y="18.0" width="1.6" height="2.2" fill="${bg}"/>
    <rect x="11.2" y="21.2" width="1.6" height="1.6" fill="${bg}"/>
    <rect x="1.2" y="11.2" width="2.2" height="1.6" fill="${bg}"/>
    <rect x="4.4" y="11.2" width="2.2" height="1.6" fill="${bg}"/>
    <rect x="7.6" y="11.2" width="1.6" height="1.6" fill="${bg}"/>
    <rect x="14.8" y="11.2" width="1.6" height="1.6" fill="${bg}"/>
    <rect x="18.0" y="11.2" width="2.2" height="1.6" fill="${bg}"/>
    <rect x="21.2" y="11.2" width="1.6" height="1.6" fill="${bg}"/>
  `
};

function iconSvg(catKey, bgColor, size){
  if (catKey === "kavsak"){
    return `<img src="${KAVSAK_IMG}" width="${size}" height="${size}" style="display:block;border-radius:50%;object-fit:contain;" alt="">`;
  }
  const shapes = ICON_SHAPES[catKey](bgColor);
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${shapes}</svg>`;
}

function renderPopupView(wrapper, loc){
  const color = CATS[loc.cat].color;
  const isCustom = loc.customContent !== undefined && loc.customContent !== null;
  const suggestion = isCustom ? loc.customContent : CONTENT_SUGGESTION[loc.cat];
  wrapper.innerHTML = `
    <div class="pp-head">
      <span class="pp-icon" style="background:${color}">${iconSvg(loc.cat, color, 15)}</span>
      <div class="pp-title">${loc.id}. ${loc.name}${loc.custom ? '<span class="pp-custom-tag">· kendi eklediğim</span>' : ''}</div>
      ${loc.custom ? `<div class="pp-head-actions"><button type="button" class="pp-icon-btn" data-action="delete-loc" aria-label="Noktayı sil" title="Noktayı sil">${TRASH_SVG}</button></div>` : ''}
    </div>
    <div class="pp-row"><b>Kategori:</b> ${CATS[loc.cat].label}</div>
    <div class="pp-row"><b>Mahalle / Bölge:</b> ${loc.neighborhood}</div>
    <div class="pp-suggestion">
      <div class="pp-sugg-head">
        <span><b>İçerik Önerisi</b>${isCustom ? '<span class="pp-edited-tag">· düzenlendi</span>' : ''}</span>
        <button type="button" class="pp-edit-btn" aria-label="İçerik önerisini düzenle" title="Düzenle">${PENCIL_SVG}</button>
      </div>
      <div class="pp-sugg-text">${escapeHtml(suggestion)}</div>
    </div>
  `;
  wrapper.querySelector(".pp-edit-btn").addEventListener("click", () => {
    renderPopupEdit(wrapper, loc);
    refreshPopup(loc);
  });
  const delBtn = wrapper.querySelector('[data-action="delete-loc"]');
  if (delBtn){
    delBtn.addEventListener("click", () => deleteLocation(loc));
  }
}

function renderPopupEdit(wrapper, loc){
  const color = CATS[loc.cat].color;
  const isCustom = loc.customContent !== undefined && loc.customContent !== null;
  const current = isCustom ? loc.customContent : CONTENT_SUGGESTION[loc.cat];
  wrapper.innerHTML = `
    <div class="pp-head">
      <span class="pp-icon" style="background:${color}">${iconSvg(loc.cat, color, 15)}</span>
      <div class="pp-title">${loc.id}. ${loc.name}</div>
    </div>
    <div class="pp-row"><b>Kategori:</b> ${CATS[loc.cat].label}</div>
    <div class="pp-row"><b>Mahalle / Bölge:</b> ${loc.neighborhood}</div>
    <div class="pp-suggestion">
      <div class="pp-sugg-head"><b>İçerik Önerisini Düzenle</b></div>
      <textarea class="pp-edit-textarea" rows="3">${escapeHtml(current)}</textarea>
      <div class="pp-edit-actions">
        <button type="button" class="pp-btn pp-btn-save">Kaydet</button>
        <button type="button" class="pp-btn pp-btn-cancel">Vazgeç</button>
        ${isCustom ? '<button type="button" class="pp-btn pp-btn-reset">Varsayılana Dön</button>' : ''}
      </div>
    </div>
  `;
  const ta = wrapper.querySelector(".pp-edit-textarea");
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  wrapper.querySelector(".pp-btn-cancel").addEventListener("click", () => {
    renderPopupView(wrapper, loc);
    refreshPopup(loc);
  });
  wrapper.querySelector(".pp-btn-save").addEventListener("click", () => {
    const val = ta.value.trim();
    if (val.length){
      loc.customContent = val;
      overrides[loc.id] = val;
    } else {
      delete loc.customContent;
      delete overrides[loc.id];
    }
    renderPopupView(wrapper, loc);
    refreshPopup(loc);
    persistOverrides();
  });
  const resetBtn = wrapper.querySelector(".pp-btn-reset");
  if (resetBtn){
    resetBtn.addEventListener("click", () => {
      delete loc.customContent;
      delete overrides[loc.id];
      renderPopupView(wrapper, loc);
      refreshPopup(loc);
      persistOverrides();
    });
  }
}

function refreshPopup(loc){
  const popup = loc.marker.getPopup();
  if (popup) popup.update();
}

function deleteLocation(loc){
  if (!confirm(`"${loc.name}" noktasını silmek istediğinize emin misiniz?`)) return;
  if (loc.marker){
    loc.marker.closePopup();
    map.removeLayer(loc.marker);
  }
  const idx = LOCATIONS.findIndex(l => l.id === loc.id);
  if (idx > -1) LOCATIONS.splice(idx, 1);
  if (overrides[loc.id] !== undefined){
    delete overrides[loc.id];
    persistOverrides();
  }
  applyFilters();
}

/* ======================= KOORDİNATA GİT ======================= */
function parseCoordinatesInput(text){
  if (!text) return null;
  let m = text.match(/@(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) m = text.match(/[?&](?:q|query|destination)=(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) m = text.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) return null;
  const lat = parseFloat(m[1]);
  const lng = parseFloat(m[2]);
  if (Number.isNaN(lat) || Number.isNaN(lng)) return null;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
  return { lat, lng };
}

function targetIcon(){
  return L.divIcon({
    className: "",
    html: `<div class="target-pin"><div class="target-pin-ring"></div><div class="target-pin-dot"></div></div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

let targetMarker = null;

function goToCoordinate(lat, lng){
  if (targetMarker){ map.removeLayer(targetMarker); targetMarker = null; }
  map.flyTo([lat, lng], 17, { duration: 0.8 });

  targetMarker = L.marker([lat, lng], { icon: targetIcon() }).addTo(map);
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `
    <div class="pp-head"><div class="pp-title">Yapıştırılan Koordinat</div></div>
    <div class="pp-row"><b>Enlem / Boylam:</b> ${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
    <div class="pp-edit-actions">
      <button type="button" class="pp-btn pp-btn-save" id="addFromCoordBtn">Buraya Nokta Ekle</button>
      <button type="button" class="pp-btn pp-btn-cancel" id="closeCoordBtn">Kapat</button>
    </div>
  `;
  targetMarker.bindPopup(wrapper, { className: "pin-popup", maxWidth: 250, minWidth: 220 });

  wrapper.querySelector("#addFromCoordBtn").addEventListener("click", () => {
    map.removeLayer(targetMarker);
    targetMarker = null;
    openNewLocationForm({ lat, lng });
  });
  wrapper.querySelector("#closeCoordBtn").addEventListener("click", () => {
    if (targetMarker){ map.removeLayer(targetMarker); targetMarker = null; }
  });

  setTimeout(() => { if (targetMarker) targetMarker.openPopup(); }, 850);
}

function handleCoordGo(){
  const input = document.getElementById("coordInput");
  const parsed = parseCoordinatesInput(input.value);
  if (!parsed){
    input.classList.add("coord-error");
    setTimeout(() => input.classList.remove("coord-error"), 1200);
    return;
  }
  goToCoordinate(parsed.lat, parsed.lng);
}

document.getElementById("coordGoBtn").addEventListener("click", handleCoordGo);
document.getElementById("coordInput").addEventListener("keydown", e => {
  if (e.key === "Enter") handleCoordGo();
});

function exportCurrentVersion(){
  const plain = LOCATIONS.map(loc => {
    const out = { id: loc.id, name: loc.name, lat: loc.lat, lng: loc.lng, cat: loc.cat, neighborhood: loc.neighborhood };
    if (loc.customContent !== undefined && loc.customContent !== null) out.customContent = loc.customContent;
    if (loc.custom) out.custom = true;
    return out;
  });
  const jsonLiteral = JSON.stringify(plain, null, 2);

  const startMarker = "/* === LOCATIONS_START === */";
  const endMarker = "/* === LOCATIONS_END === */";
  const startIdx = ORIGINAL_SOURCE.indexOf(startMarker);
  const endIdx = ORIGINAL_SOURCE.indexOf(endMarker);

  if (startIdx === -1 || endIdx === -1){
    alert("Dışa aktarma hazırlanırken bir sorun oluştu. Lütfen sayfayı yenileyip tekrar deneyin.");
    return;
  }

  const before = ORIGINAL_SOURCE.slice(0, startIdx + startMarker.length);
  const after = ORIGINAL_SOURCE.slice(endIdx);
  const newSource = "<!DOCTYPE html>\n" + `${before}\nconst LOCATIONS = ${jsonLiteral};\n${after}`;

  const blob = new Blob([newSource], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `totem-harita-${ts}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("downloadBtn").addEventListener("click", exportCurrentVersion);

/* ======================= PERSISTENT / SHARED STORAGE ======================= */
const STORAGE_KEY = "content-overrides";
const hasStorage = typeof window.storage !== "undefined";
let overrides = {};

async function loadOverrides(){
  if (!hasStorage) return;
  try {
    const res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value) overrides = JSON.parse(res.value);
  } catch (e){
    overrides = {};
  }
  LOCATIONS.forEach(loc => {
    if (overrides[loc.id] !== undefined) loc.customContent = overrides[loc.id];
  });
}

async function persistOverrides(){
  if (!hasStorage) return;
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(overrides), true);
  } catch (e){
    console.error("Kayıt hatası:", e);
  }
}

/* ======================= MARKERS + POPUPS ======================= */
async function initMarkers(){
  await loadOverrides();
  LOCATIONS.forEach(loc => {
    const color = CATS[loc.cat].color;
    loc.marker = L.marker([loc.lat, loc.lng], { icon: makeIcon(color, loc.cat) });
    const wrapper = document.createElement("div");
    renderPopupView(wrapper, loc);
    loc.marker.bindPopup(wrapper, { className: "pin-popup", maxWidth: 270, minWidth: 230 });
    loc.marker.addTo(map);
  });
  applyFilters();
}
initMarkers();

/* ======================= LEGEND ======================= */
const legendEl = document.getElementById("mapLegend");
legendEl.innerHTML = `<h4>Kategori Lejantı</h4>` + Object.entries(CATS).map(([key, c]) =>
  `<div class="leg-row"><span class="cat-dot" style="background:${c.color}">${iconSvg(key, c.color, 11)}</span>${c.label}</div>`
).join("");

/* ======================= SIDEBAR: CATEGORY FILTERS ======================= */
const categoryListEl = document.getElementById("categoryList");

function renderCategoryFilters(){
  categoryListEl.innerHTML = Object.entries(CATS).map(([key, c]) => {
    const count = LOCATIONS.filter(l => l.cat === key).length;
    const inactive = activeCats.has(key) ? "" : "inactive";
    return `<div class="cat-row ${inactive}" data-cat="${key}" tabindex="0" role="checkbox" aria-checked="${activeCats.has(key)}">
      <span class="cat-dot" style="background:${c.color}">${iconSvg(key, c.color, 13)}</span>
      <span class="cat-label">${c.label}</span>
      <span class="cat-count">${count}</span>
    </div>`;
  }).join("");

  categoryListEl.querySelectorAll(".cat-row").forEach(row => {
    const toggle = () => {
      const key = row.dataset.cat;
      if (activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
      applyFilters();
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
}

/* ======================= SEARCH ======================= */
document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  applyFilters();
});

/* ======================= LOCATION LIST + FILTER LOGIC ======================= */
const locationListEl = document.getElementById("locationList");
const listMetaEl = document.getElementById("listMeta");
const statVisibleEl = document.getElementById("statVisible");

function matchesFilters(loc){
  if (!activeCats.has(loc.cat)) return false;
  if (searchTerm){
    const hay = (loc.name + " " + loc.neighborhood).toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  return true;
}

function renderLocationList(visible){
  if (visible.length === 0){
    locationListEl.innerHTML = `<div class="empty-state">Bu filtrelerle eşleşen nokta yok.</div>`;
    return;
  }
  locationListEl.innerHTML = visible.map(loc => `
    <div class="loc-card" data-id="${loc.id}" tabindex="0">
      <div class="loc-top">
        <span class="loc-dot" style="background:${CATS[loc.cat].color}">${iconSvg(loc.cat, CATS[loc.cat].color, 11)}</span>
        <div>
          <div class="loc-name">${loc.id}. ${loc.name}</div>
          <div class="loc-sub">${loc.neighborhood} · ${CATS[loc.cat].label}</div>
          <div class="loc-badges">${loc.custom ? '<span class="badge">Özel</span>' : ''}</div>
        </div>
      </div>
    </div>
  `).join("");

  locationListEl.querySelectorAll(".loc-card").forEach(card => {
    const focusLoc = () => {
      const loc = LOCATIONS.find(l => l.id === Number(card.dataset.id));
      map.flyTo([loc.lat, loc.lng], 16, { duration: 0.6 });
      setTimeout(() => loc.marker.openPopup(), 350);
    };
    card.addEventListener("click", focusLoc);
    card.addEventListener("keydown", e => { if (e.key === "Enter") focusLoc(); });
  });
}

function applyFilters(){
  const visible = LOCATIONS.filter(matchesFilters);
  const visibleIds = new Set(visible.map(l => l.id));

  LOCATIONS.forEach(loc => {
    const onMap = map.hasLayer(loc.marker);
    if (visibleIds.has(loc.id) && !onMap) loc.marker.addTo(map);
    if (!visibleIds.has(loc.id) && onMap) map.removeLayer(loc.marker);
  });

  renderCategoryFilters();
  renderLocationList(visible);
  listMetaEl.textContent = `${visible.length} / ${LOCATIONS.length} nokta gösteriliyor`;
  statVisibleEl.textContent = visible.length;
  document.getElementById("statTotal").textContent = LOCATIONS.length;
}

/* ======================= SIDEBAR TOGGLE (Sunum Modu) ======================= */
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("toggleSidebar");
toggleBtn.addEventListener("click", () => {
  sidebar.classList.toggle("collapsed");
  toggleBtn.textContent = sidebar.classList.contains("collapsed") ? "Listeyi Göster" : "Sunum Modu";
  setTimeout(() => map.invalidateSize(), 260);
});
