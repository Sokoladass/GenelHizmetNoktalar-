<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başakşehir Genel Hizmet Haritası</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width:100%; height:100%; overflow:hidden; }
    #app { display:flex; width:100vw; height:100vh; }
    #sidebar { width:360px; height:100%; background:#fff; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; z-index:1000; box-shadow:2px 0 8px rgba(0,0,0,0.06); }
    #sidebar-header { padding:18px; background:#0f172a; color:#fff; }
    #sidebar-header h1 { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
    #sidebar-header p { font-size:0.8rem; color:#94a3b8; }
    #search-box { padding:12px 16px; border-bottom:1px solid #f1f5f9; }
    #search-input { width:100%; padding:9px 12px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.85rem; outline:none; }
    #category-list { flex:1; overflow-y:auto; padding:12px 16px; }
    .cat-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:4px; transition:0.2s; font-size:0.85rem; user-select:none; }
    .cat-item:hover { background:#f8fafc; }
    .cat-item.inactive { opacity:0.35; }
    .cat-name { display:flex; align-items:center; gap:8px; }
    .cat-badge { font-size:0.75rem; background:#e2e8f0; color:#475569; padding:2px 7px; border-radius:10px; font-weight:600; }
    #map { flex:1; height:100%; }
    .custom-marker { width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,0.4); }
    @media(max-width:768px){ #app { flex-direction:column; } #sidebar { width:100%; height:45%; } #map { height:55%; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>Başakşehir Hizmet Haritası</h1>
        <p>25 Kategori • 289 Tesis ve Kurum</p>
      </div>
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Kurum, okul, cami veya mahalle ara...">
      </div>
      <div id="category-list"></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([41.095, 28.765], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    const categoryColors = {
      "Kültür ve Yaşam Merkezleri": "#1E40AF", "Spor Merkezleri": "#EA580C",
      "Alışveriş Alanları": "#7E22CE", "Millet Kütüphaneleri": "#9A3412",
      "Hizmet Binaları": "#0284C7", "Yeşil Alanlar": "#15803D",
      "Stadyumlar": "#22C55E", "Hastaneler": "#DC2626",
      "Hayvan Hastanesi": "#C026D3", "İSKİ": "#06B6D4",
      "İGDAŞ": "#0284C7", "BEDAŞ": "#EAB308", "Living Lab": "#475569",
      "Bizim Çınarlar Yaşam Merkezi": "#047857", "U Metro": "#E11D48",
      "M Metro": "#2563EB", "Tarihi Alanlar": "#78350F",
      "Üniversiteler": "#D97706", "VR Tema Park": "#0891B2",
      "Hızlı Oto Yıkama Alanı": "#38BDF8", "Cemevleri": "#991B1B",
      "Polis Merkezleri": "#EC4899", "İtfaiye İstasyonları": "#B91C1C",
      "Eğitim Noktaları": "#64748B", "Camiler": "#D97706"
    };

    let disabledCategories = new Set();
    let allPoints = [];
    let activeMarkers = [];

    fetch('locations.json')
      .then(res => res.json())
      .then(data => {
        allPoints = data;
        buildSidebar();
        renderMarkers();
      })
      .catch(err => console.error("locations.json okunamadı:", err));

    function renderMarkers() {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];
      const query = document.getElementById('search-input').value.toLowerCase();

      allPoints.forEach(p => {
        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;

        const color = categoryColors[p.cat] || "#475569";
        const icon = L.divIcon({
          className: 'custom-icon',
          html: `<div class="custom-marker" style="background:${color};"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const m = L.marker([p.lat, p.lng], { icon })
          .bindPopup(`
            <div style="font-size:13px; min-width:180px;">
              <strong style="color:#0f172a; font-size:14px;">${p.name}</strong><br>
              <span style="color:#64748b; font-size:12px;">${p.cat}</span><br>
              <div style="margin-top:4px; color:#334155;">📍 ${p.mah}</div>
              <div style="margin-top:8px; border-top:1px solid #e2e8f0; padding-top:6px;">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" style="color:#2563eb; text-decoration:none; font-weight:600; font-size:12px;">Google Haritalar'da Aç ↗</a>
              </div>
            </div>
          `);
        m.addTo(map);
        activeMarkers.push(m);
      });
    }

    function buildSidebar() {
      const counts = {};
      allPoints.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
      const container = document.getElementById('category-list');
      container.innerHTML = '';

      Object.keys(counts).sort().forEach(cat => {
        const col = categoryColors[cat] || "#475569";
        const div = document.createElement('div');
        div.className = 'cat-item' + (disabledCategories.has(cat) ? ' inactive' : '');
        div.innerHTML = `
          <div class="cat-name">
            <span style="width:11px; height:11px; border-radius:50%; background:${col}; display:inline-block;"></span>
            <span>${cat}</span>
          </div>
          <span class="cat-badge">${counts[cat]}</span>
        `;
        div.onclick = () => {
          if (disabledCategories.has(cat)) disabledCategories.delete(cat);
          else disabledCategories.add(cat);
          buildSidebar();
          renderMarkers();
        };
        container.appendChild(div);
      });
    }

    document.getElementById('search-input').addEventListener('input', renderMarkers);
  </script>
</body>
</html>
