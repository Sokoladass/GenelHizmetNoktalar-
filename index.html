<html lang="tr">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f1f5f9;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
    }

    /* Glassmorphism Floating Sidebar */
    #sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      bottom: 16px;
      width: 380px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    #sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, transparent 100%);
      border-radius: 16px 16px 0 0;
    }
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    #sidebar-header h1 {
      font-size: 1.22rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    #sidebar-header p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    #quick-controls {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-3d {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-3d:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      transform: translateY(-1px);
    }
    .btn-3d.active {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    #search-box {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }
    #search-box i {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
    }
    #search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 0.82rem;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    #search-input:focus {
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .nav-tabs {
      display: flex;
      padding: 8px 16px 0;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-btn {
      padding: 8px 4px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }
    .tab-btn.active {
      color: #38bdf8;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #38bdf8;
      border-radius: 2px;
      box-shadow: 0 0 8px #38bdf8;
    }

    #tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }
    #tab-content::-webkit-scrollbar {
      width: 5px;
    }
    #tab-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 5px;
      background: rgba(30, 41, 59, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .cat-item:hover {
      background: rgba(51, 65, 85, 0.5);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(2px);
    }
    .cat-item.inactive {
      opacity: 0.35;
      filter: grayscale(80%);
    }
    .cat-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cat-glow-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px currentColor;
    }
    .cat-title {
      font-weight: 600;
      color: #e2e8f0;
    }
    .cat-count {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    .place-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 6px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s;
    }
    .place-item:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(3px);
    }
    .place-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 3px;
    }
    .place-meta {
      font-size: 0.72rem;
      color: #94a3b8;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #floating-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .hud-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }
    .hud-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
      transform: scale(1.05);
    }

    .maplibregl-popup-content {
      background: rgba(15, 23, 42, 0.92) !important;
      backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      border-radius: 14px !important;
      padding: 16px !important;
      color: #f1f5f9 !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7) !important;
    }
    .maplibregl-popup-tip {
      border-top-color: rgba(15, 23, 42, 0.92) !important;
    }
    .marker-pin-3d {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 16px currentColor, 0 4px 10px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .marker-pin-3d:hover {
      transform: scale(1.35) translateY(-4px);
    }

    @media(max-width: 768px) {
      #sidebar {
        width: calc(100% - 32px);
        height: 48%;
        bottom: 16px;
        top: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="floating-hud">
      <button class="hud-btn" onclick="togglePerspective()" title="3D / 2D Perspektif Değiştir">
        <i class="fa-solid fa-cube"></i>
      </button>
      <button class="hud-btn" onclick="rotateCamera()" title="Şehir Etrafında Sinematik Tur">
        <i id="rotate-icon" class="fa-solid fa-arrows-rotate"></i>
      </button>
      <button class="hud-btn" onclick="resetToBasaksehir()" title="Merkeze Dön">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">
        <div class="brand-tag">
          <i class="fa-solid fa-city"></i> Smart GIS • 3D City Twin
        </div>
        <h1>Başakşehir Hizmet Haritası</h1>
        <p>25 Kategori • 289 Önemli Nokta</p>
      </div>

      <div id="quick-controls">
        <button id="btn-tilt" class="btn-3d active" onclick="setPitch(60)">
          <i class="fa-solid fa-layer-group"></i> 3D Binalar (60°)
        </button>
        <button id="btn-top" class="btn-3d" onclick="setPitch(0)">
          <i class="fa-solid fa-map"></i> 2D Üstten (0°)
        </button>
      </div>

      <div id="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Kurum, okul, metro, cami ara...">
      </div>

      <div class="nav-tabs">
        <button id="tab-cat-btn" class="tab-btn active" onclick="switchTab('categories')">Kategoriler</button>
        <button id="tab-list-btn" class="tab-btn" onclick="switchTab('places')">Nokta Listesi (<span id="total-badge">289</span>)</button>
      </div>

      <div id="tab-content">
        <div id="categories-view"></div>
        <div id="places-view" style="display:none;"></div>
      </div>
    </div>
  </div>

    function renderMarkers() {
      activeMarkers.forEach(m => m.remove());
      activeMarkers = [];
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      allPoints.forEach((p, idx) => {
        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;

        const color = categoryColors[p.cat] || "#38bdf8";

        const el = document.createElement('div');
        el.className = 'marker-pin-3d';
        el.style.backgroundColor = color;
        el.style.color = color;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          flyTo3D(p.lng, p.lat, 16.5, 65, p);
        });

        const popupHTML = `
          <div style="font-family:'Plus Jakarta Sans',sans-serif; min-width:210px;">
            <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:${color}; letter-spacing:0.05em; margin-bottom:4px;">

              ${p.name}

              <i class="fa-solid fa-location-dot" style="color:#64748b; margin-right:4px;"></i>${p.mah}

            <div style="display:flex; gap:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">

                 style="display:inline-flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:700; color:#38bdf8; text-decoration:none;">

              </a>
            </div>
          </div>
        `;

        const popup = new maplibregl.Popup({ offset: 12, closeButton: false })
          .setHTML(popupHTML);

        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([p.lng, p.lat])
          .setPopup(popup)
          .addTo(map);

        activeMarkers.push(marker);
      });

    function flyTo3D(lng, lat, zoom = 16, pitch = 65, pointData = null) {
      map.flyTo({
        center: [lng, lat],
        zoom: zoom,
        pitch: pitch,
        bearing: Math.floor(Math.random() * 60) - 30,
        speed: 1.2,
        curve: 1.4,
        essential: true
      });

      if (pointData) {
        setTimeout(() => {
          const targetMarker = activeMarkers.find(m => {
            const ll = m.getLngLat();
            return Math.abs(ll.lng - lng) < 0.0001 && Math.abs(ll.lat - lat) < 0.0001;
          });
          if (targetMarker) targetMarker.togglePopup();
        }, 1200);
      }
    }

    function buildCategories() {
      const counts = {};
      allPoints.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
      const container = document.getElementById('categories-view');
      container.innerHTML = '';

      Object.keys(counts).sort().forEach(cat => {
        const col = categoryColors[cat] || "#38bdf8";
        const div = document.createElement('div');
        div.className = 'cat-item' + (disabledCategories.has(cat) ? ' inactive' : '');
        div.innerHTML = `
          <div class="cat-left">
            <span class="cat-glow-dot" style="background:${col}; color:${col};"></span>
            <span class="cat-title">${cat}</span>
          </div>
          <span class="cat-count">${counts[cat]}</span>
        `;
        div.onclick = () => {
          if (disabledCategories.has(cat)) disabledCategories.delete(cat);
          else disabledCategories.add(cat);
          buildCategories();
          renderMarkers();
          buildPlacesList();
        };
        container.appendChild(div);
      });
    }

        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;
        matched++;

        const col = categoryColors[p.cat] || "#38bdf8";
        const div = document.createElement('div');
        div.className = 'place-item';
        div.innerHTML = `
          <div class="place-name">${p.name}</div>
          <div class="place-meta">
            <span style="color:${col}; font-weight:700;">● ${p.cat}</span>
            <span>📍 ${p.mah}</span>
          </div>
        `;
        div.onclick = () => {
          flyTo3D(p.lng, p.lat, 16.8, 65, p);
        };
        container.appendChild(div);
      });

      document.getElementById('total-badge').textContent = matched;
    }

    function setPitch(angle) {
      map.easeTo({ pitch: angle, duration: 1000 });
      document.getElementById('btn-tilt').classList.toggle('active', angle > 0);
      document.getElementById('btn-top').classList.toggle('active', angle === 0);
    }

    function togglePerspective() {
      const currentPitch = map.getPitch();
      setPitch(currentPitch > 20 ? 0 : 65);
    }

    function resetToBasaksehir() {
      stopRotation();
      map.flyTo({
        center: [28.775, 41.105],
        zoom: 12.8,
        pitch: 60,
        bearing: -15,
        speed: 1.2
      });
    }

    function rotateCamera() {
      if (isRotating) {
        stopRotation();
      } else {
        isRotating = true;
        document.getElementById('rotate-icon').classList.add('fa-spin');
        animateRotation();
      }
    }

    function animateRotation() {
      if (!isRotating) return;
      map.setBearing(map.getBearing() + 0.2);
      rotationAnimationId = requestAnimationFrame(animateRotation);
    }

    function stopRotation() {
      isRotating = false;
      document.getElementById('rotate-icon').classList.remove('fa-spin');
      if (rotationAnimationId) cancelAnimationFrame(rotationAnimationId);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-cat-btn').classList.toggle('active', tab === 'categories');
      document.getElementById('tab-list-btn').classList.toggle('active', tab === 'places');
      document.getElementById('categories-view').style.display = tab === 'categories' ? 'block' : 'none';
      document.getElementById('places-view').style.display = tab === 'places' ? 'block' : 'none';
    }

    document.getElementById('search-input').addEventListener('input', () => {
      renderMarkers();
      buildPlacesList();
      if (document.getElementById('search-input').value.trim() !== '') {
        switchTab('places');
      }
    });
  </script>
</body>
</html>
