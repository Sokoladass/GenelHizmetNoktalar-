<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başakşehir 3D Dijital İkiz | Mapbox Standard</title>
  <meta name="description" content="Başakşehir ilçesindeki kamu hizmet noktalarını 3D harita üzerinde keşfedin.">

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="status-banner" class="status-banner hidden" aria-live="polite"></div>

  <div id="token-modal">
    <div class="token-box">
      <h2>Mapbox Erişim Anahtarı (Token)</h2>
      <p>Mapbox v3 Standard 3D motoru için public token gereklidir.<br>
        <a href="https://account.mapbox.com/" target="_blank" rel="noopener" style="color:#38bdf8;text-decoration:none;font-weight:700;">mapbox.com</a>
        hesabınızdaki <code>pk.eyJ...</code> anahtarını girin.</p>
      <input type="text" id="token-input" class="token-input" placeholder="pk.eyJ1...">
      <button id="save-token-btn" class="token-btn">Haritayı Başlat</button>
    </div>
  </div>

  <div id="hud-tools">
    <button id="sidebar-toggle-btn" class="hud-btn" title="Paneli Göster/Gizle">
      <i id="sidebar-toggle-icon" class="fa-solid fa-bars"></i>
    </button>
    <button class="hud-btn" data-action="togglePerspective" title="3D / 2D Perspektif Değiştir">
      <i class="fa-solid fa-cube"></i>
    </button>
    <button class="hud-btn" data-action="rotateCamera" title="Şehir Çevresinde Tur">
      <i id="orbit-icon" class="fa-solid fa-arrows-rotate"></i>
    </button>
    <button class="hud-btn" data-action="resetToBasaksehir" title="Merkeze Dön">
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <div class="badge-pill"><i class="fa-solid fa-satellite"></i> Belediye Portalı</div>
      <h1>Başakşehir Dijital İkiz</h1>
      <p>Kamusal hizmet noktaları • 3D harita • canlı haritalama</p>
    </div>

    <div class="portal-stats">
      <div class="stat-card">
        <span>Toplam</span>
        <strong id="stat-total">0</strong>
      </div>
      <div class="stat-card">
        <span>Kategori</span>
        <strong id="stat-categories">0</strong>
      </div>
      <div class="stat-card">
        <span>Aktif</span>
        <strong id="stat-visible">0</strong>
      </div>
    </div>

    <div class="lighting-bar">
      <button class="btn-light active" data-light="dusk">
        <i class="fa-solid fa-cloud-sun"></i> Alacakaranlık
      </button>
      <button class="btn-light" data-light="night">
        <i class="fa-solid fa-moon"></i> Gece
      </button>
      <button class="btn-light" data-light="day">
        <i class="fa-solid fa-sun"></i> Gündüz
      </button>
      <button class="btn-light" data-light="dawn">
        <i class="fa-solid fa-mountain-sun"></i> Şafak
      </button>
    </div>

    <div id="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="Tesis, okul, cami, metro ara...">
      <button id="search-clear" title="Aramayı Temizle">✕</button>
    </div>

    <div class="tab-header">
      <button id="tab-cat-btn" class="tab-item active" data-tab="cat">Kategoriler</button>
      <button id="tab-place-btn" class="tab-item" data-tab="place">
        Tesis Listesi (<span id="count-badge">0</span>)
      </button>
    </div>

    <div id="list-container">
      <div id="cat-view"></div>
      <div id="place-view" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
