<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başakşehir 3D Dijital İkiz | Mapbox Standard</title>

  <!-- Mapbox GL JS v3 -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body, html { width:100%; height:100%; overflow:hidden; background:#0b0f19; color:#f8fafc; }
    #app { display:flex; width:100vw; height:100vh; position:relative; }
    #map { flex:1; height:100%; width:100%; }

    /* Glassmorphism Sidebar */
    #sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      bottom: 16px;
      width: 390px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }
    #sidebar-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, transparent 100%);
      border-radius: 18px 18px 0 0;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 8px;
    }
    #sidebar-header h1 { font-size: 1.25rem; font-weight: 800; color: #fff; line-height: 1.25; }
    #sidebar-header p { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; }

    /* Token Uyarısı */
    #token-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      z-index: 100;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #token-modal.show { display: flex; }
    .token-box {
      max-width: 460px;
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .token-box h2 { font-size: 1.2rem; margin-bottom: 10px; color: #38bdf8; }
    .token-box p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; }
    .token-input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      margin-bottom: 12px;
      outline: none;
    }
    .token-btn {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .token-btn:hover { background: #0369a1; }

    /* Lighting Controls */
    .lighting-bar {
      padding: 10px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.4);
    }
    .btn-light {
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: 0.2s;
    }
    .btn-light:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .btn-light.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    #search-box {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }
    #search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 0.82rem;
      color: #fff;
      outline: none;
    }
    #search-input:focus { border-color: #38bdf8; }
    #search-box i {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
    }

    .tab-header {
      display: flex;
      padding: 8px 16px 0;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-item {
      padding: 8px 4px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
    }
    .tab-item.active { color: #38bdf8; }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 2px;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }
    #list-container::-webkit-scrollbar { width: 5px; }
    #list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

    .cat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 5px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-row:hover { background: rgba(51, 65, 85, 0.6); transform: translateX(2px); }
    .cat-row.inactive { opacity: 0.35; filter: grayscale(1); }
    .cat-left { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; font-weight: 600; }
    .cat-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
    .cat-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 12px; background: rgba(255,255,255,0.08); color:#94a3b8; }

    .place-row {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: 0.2s;
    }
    .place-row:hover { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4); transform: translateX(3px); }
    .place-name { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .place-meta { font-size: 0.72rem; color: #94a3b8; display: flex; gap: 8px; }

    #hud-tools {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .hud-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: 0.2s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hud-btn:hover { background: rgba(56, 189, 248, 0.25); color: #38bdf8; border-color: #38bdf8; transform: scale(1.05); }

    .marker-pin-3d {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 16px currentColor, 0 4px 12px rgba(0,0,0,0.7);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .marker-pin-3d:hover { transform: scale(1.4) translateY(-3px); }
    .mapboxgl-popup-content {
      background: rgba(15, 23, 42, 0.94) !important;
      backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      border-radius: 14px !important;
      padding: 16px !important;
      color: #f1f5f9 !important;
    }
    .mapboxgl-popup-tip { border-top-color: rgba(15, 23, 42, 0.94) !important; }

    @media(max-width:768px) {
      #sidebar { width: calc(100% - 32px); height: 48%; top: auto; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="token-modal">
      <div class="token-box">
        <h2>Mapbox Erişim Anahtarı (Token)</h2>
        <p>Mapbox v3 Standard 3D motoru için public token gereklidir. <br><a href="https://account.mapbox.com/" target="_blank" style="color:#38bdf8; text-decoration:none; font-weight:700;">mapbox.com</a> hesabınızdaki <code>pk.eyJ...</code> anahtarını girin.</p>
        <input type="text" id="token-input" class="token-input" placeholder="pk.eyJ1...">
        <button class="token-btn" onclick="saveToken()">Haritayı Başlat</button>
      </div>
    </div>

    <div id="hud-tools">
      <button class="hud-btn" onclick="togglePerspective()" title="3D / 2D Perspektif Değiştir"><i class="fa-solid fa-cube"></i></button>
      <button class="hud-btn" onclick="rotateCamera()" title="Şehir Çevresinde Tur"><i id="orbit-icon" class="fa-solid fa-arrows-rotate"></i></button>
      <button class="hud-btn" onclick="resetToBasaksehir()" title="Merkeze Dön"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">
        <div class="badge-pill"><i class="fa-solid fa-satellite"></i> Mapbox v3 Standard 3D</div>
        <h1>Başakşehir Dijital İkiz</h1>
        <p>3D Binalar • Dinamik Işıklandırma • 289 Tesis</p>
      </div>

      <div class="lighting-bar">
        <button class="btn-light active" onclick="setLighting('dusk')"><i class="fa-solid fa-cloud-sun"></i> Alacakaranlık</button>
        <button class="btn-light" onclick="setLighting('night')"><i class="fa-solid fa-moon"></i> Gece</button>
        <button class="btn-light" onclick="setLighting('day')"><i class="fa-solid fa-sun"></i> Gündüz</button>
        <button class="btn-light" onclick="setLighting('dawn')"><i class="fa-solid fa-mountain-sun"></i> Şafak</button>
      </div>

      <div id="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Tesis, okul, cami, metro ara...">
      </div>

      <div class="tab-header">
        <button id="tab-cat-btn" class="tab-item active" onclick="switchTab('cat')">Kategoriler</button>
        <button id="tab-place-btn" class="tab-item" onclick="switchTab('place')">Tesis Listesi (<span id="count-badge">289</span>)</button>
      </div>

      <div id="list-container">
        <div id="cat-view"></div>
        <div id="place-view" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TOKEN = "YOUR_MAPBOX_ACCESS_TOKEN";
    let userToken = localStorage.getItem('mapbox_token') || (DEFAULT_TOKEN !== "YOUR_MAPBOX_ACCESS_TOKEN" ? DEFAULT_TOKEN : null);

    if (!userToken) {
      document.getElementById('token-modal').classList.add('show');
    } else {
      initMapbox(userToken);
    }

    function saveToken() {
      const val = document.getElementById('token-input').value.trim();
      if (!val.startsWith('pk.')) {
        alert("Lütfen geçerli bir Mapbox Public Token (pk.eyJ...) girin.");
        return;
      }
      localStorage.setItem('mapbox_token', val);
      document.getElementById('token-modal').classList.remove('show');
      initMapbox(val);
    }

    const categoryColors = {
      "Kültür ve Yaşam Merkezleri": "#38bdf8", "Spor Merkezleri": "#f97316",
      "Alışveriş Alanları": "#a855f7", "Millet Kütüphaneleri": "#fb923c",
      "Hizmet Binaları": "#0284c7", "Yeşil Alanlar": "#22c55e",
      "Stadyumlar": "#10b981", "Hastaneler": "#ef4444",
      "Hayvan Hastanesi": "#ec4899", "İSKİ": "#06b6d4",
      "İGDAŞ": "#3b82f6", "BEDAŞ": "#eab308", "Living Lab": "#64748b",
      "Bizim Çınarlar Yaşam Merkezi": "#14b8a6", "U Metro": "#f43f5e",
      "M Metro": "#3b82f6", "Tarihi Alanlar": "#b45309",
      "Üniversiteler": "#d97706", "VR Tema Park": "#06b6d4",
      "Hızlı Oto Yıkama Alanı": "#0ea5e9", "Cemevleri": "#dc2626",
      "Polis Merkezleri": "#f43f5e", "İtfaiye İstasyonları": "#e11d48",
      "Eğitim Noktaları": "#94a3b8", "Camiler": "#eab308"
    };

    let map = null;
    let allPoints = [];
    let activeMarkers = [];
    let disabledCategories = new Set();
    let isRotating = false;
    let rotationReq = null;

    function initMapbox(token) {
      mapboxgl.accessToken = token;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard',
        center: [28.775, 41.105],
        zoom: 13,
        pitch: 62,
        bearing: -18,
        maxPitch: 85
      });

      map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'bottom-right');

      map.on('style.load', () => {
        map.setConfigProperty('basemap', 'lightPreset', 'dusk');

        fetch('locations.json')
          .then(res => res.json())
          .then(data => {
            allPoints = data;
            renderMarkers();
            buildCategories();
            buildPlacesList();
          })
          .catch(err => console.error("locations.json yüklenemedi:", err));
      });
    }

    function setLighting(preset) {
      if (!map) return;
      map.setConfigProperty('basemap', 'lightPreset', preset);
      document.querySelectorAll('.btn-light').forEach(b => b.classList.remove('active'));
      event.target.closest('.btn-light').classList.add('active');
    }

    function renderMarkers() {
      activeMarkers.forEach(m => m.remove());
      activeMarkers = [];
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      allPoints.forEach((p, idx) => {
        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;

        const color = categoryColors[p.cat] || "#38bdf8";

        const el = document.createElement('div');
        el.className = 'marker-pin-3d';
        el.style.backgroundColor = color;
        el.style.color = color;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          flyTo3D(p.lng, p.lat, 16.8, 65, p);
        });

        const popup = new mapboxgl.Popup({ offset: 14, closeButton: false })
          .setHTML(`
            <div style="font-family:'Plus Jakarta Sans',sans-serif; min-width:210px;">
              <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:${color}; letter-spacing:0.05em; margin-bottom:4px;">
                ${p.cat}
              </div>
              <h3 style="font-size:0.98rem; font-weight:800; color:#fff; line-height:1.25; margin-bottom:6px;">
                ${p.name}
              </h3>
              <div style="font-size:0.78rem; color:#94a3b8; margin-bottom:10px;">
                <i class="fa-solid fa-location-dot" style="color:#64748b; margin-right:4px;"></i>${p.mah}
              </div>
              <div style="display:flex; gap:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" 
                   style="display:inline-flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:700; color:#38bdf8; text-decoration:none;">
                  <i class="fa-solid fa-diamond-turn-right"></i> Yol Tarifi Al ↗
                </a>
              </div>
            </div>
          `);

        const marker = new mapboxgl.Marker({ element: el })
          .setLngLat([p.lng, p.lat])
          .setPopup(popup)
          .addTo(map);

        activeMarkers.push(marker);
      });
    }

    function flyTo3D(lng, lat, zoom = 16.5, pitch = 65, p = null) {
      if (!map) return;
      map.flyTo({
        center: [lng, lat],
        zoom: zoom,
        pitch: pitch,
        bearing: Math.floor(Math.random() * 60) - 30,
        speed: 1.2,
        curve: 1.4,
        essential: true
      });
    }

    function buildCategories() {
      const counts = {};
      allPoints.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
      const container = document.getElementById('cat-view');
      container.innerHTML = '';

      Object.keys(counts).sort().forEach(cat => {
        const col = categoryColors[cat] || "#38bdf8";
        const div = document.createElement('div');
        div.className = 'cat-row' + (disabledCategories.has(cat) ? ' inactive' : '');
        div.innerHTML = `
          <div class="cat-left">
            <span class="cat-dot" style="background:${col}; color:${col};"></span>
            <span>${cat}</span>
          </div>
          <span class="cat-badge">${counts[cat]}</span>
        `;
        div.onclick = () => {
          if (disabledCategories.has(cat)) disabledCategories.delete(cat);
          else disabledCategories.add(cat);
          buildCategories();
          renderMarkers();
          buildPlacesList();
        };
        container.appendChild(div);
      });
    }

    function buildPlacesList() {
      const container = document.getElementById('place-view');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      container.innerHTML = '';

      let count = 0;
      allPoints.forEach((p, idx) => {
        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;
        count++;

        const col = categoryColors[p.cat] || "#38bdf8";
        const div = document.createElement('div');
        div.className = 'place-row';
        div.innerHTML = `
          <div class="place-name">${p.name}</div>
          <div class="place-meta">
            <span style="color:${col}; font-weight:700;">● ${p.cat}</span>
            <span>📍 ${p.mah}</span>
          </div>
        `;
        div.onclick = () => flyTo3D(p.lng, p.lat, 16.8, 65, p);
        container.appendChild(div);
      });

      document.getElementById('count-badge').textContent = count;
    }

    function togglePerspective() {
      if (!map) return;
      const pitch = map.getPitch();
      map.easeTo({ pitch: pitch > 20 ? 0 : 65, duration: 1000 });
    }

    function resetToBasaksehir() {
      if (!map) return;
      stopRotation();
      map.flyTo({ center: [28.775, 41.105], zoom: 13, pitch: 62, bearing: -18, speed: 1.2 });
    }

    function rotateCamera() {
      if (!map) return;
      if (isRotating) {
        stopRotation();
      } else {
        isRotating = true;
        document.getElementById('orbit-icon').classList.add('fa-spin');
        animateOrbit();
      }
    }

    function animateOrbit() {
      if (!isRotating || !map) return;
      map.setBearing(map.getBearing() + 0.2);
      rotationReq = requestAnimationFrame(animateOrbit);
    }

    function stopRotation() {
      isRotating = false;
      document.getElementById('orbit-icon').classList.remove('fa-spin');
      if (rotationReq) cancelAnimationFrame(rotationReq);
    }

    function switchTab(t) {
      document.getElementById('tab-cat-btn').classList.toggle('active', t === 'cat');
      document.getElementById('tab-place-btn').classList.toggle('active', t === 'place');
      document.getElementById('cat-view').style.display = t === 'cat' ? 'block' : 'none';
      document.getElementById('place-view').style.display = t === 'place' ? 'block' : 'none';
    }

    document.getElementById('search-input').addEventListener('input', () => {
      renderMarkers();
      buildPlacesList();
      if (document.getElementById('search-input').value.trim() !== '') switchTab('place');
    });
  </script>
</body>
</html>
