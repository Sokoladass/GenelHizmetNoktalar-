  <meta charset="UTF-8">

  <title>Başakşehir Genel Hizmet Haritası</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width:100%; height:100%; overflow:hidden; }
    #app { display:flex; width:100vw; height:100vh; }
    #sidebar { width:360px; height:100%; background:#fff; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; z-index:1000; box-shadow:2px 0 8px rgba(0,0,0,0.06); }
    #sidebar-header { padding:16px; background:#0f172a; color:#fff; }
    #sidebar-header h1 { font-size:1.15rem; font-weight:700; margin-bottom:4px; }
    #sidebar-header p { font-size:0.8rem; color:#94a3b8; }
    #search-box { padding:12px 16px; border-bottom:1px solid #f1f5f9; }
    #search-input { width:100%; padding:9px 12px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.85rem; outline:none; }
    #search-input:focus { border-color:#2563eb; }
    #category-list { flex:1; overflow-y:auto; padding:10px 14px; }
    .cat-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:4px; transition:0.15s; font-size:0.85rem; user-select:none; }
    .cat-item:hover { background:#f1f5f9; }
    .cat-item.inactive { opacity:0.35; }
    .cat-name { display:flex; align-items:center; gap:8px; font-weight:500; color:#1e293b; }
    .cat-dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex-shrink:0; }
    .cat-badge { font-size:0.75rem; background:#e2e8f0; color:#475569; padding:2px 7px; border-radius:10px; font-weight:600; }
    #map { flex:1; height:100%; }
    .custom-marker { width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,0.4); }
    @media(max-width:768px){
      #app { flex-direction:column; }
      #sidebar { width:100%; height:45%; }
      #map { height:55%; }
    }
  </style>
</head>

    let disabledCategories = new Set();
    let activeMarkers = [];

    function renderMarkers() {
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      allPoints.forEach(p => {
        if (disabledCategories.has(p.cat)) return;
        if (query && !p.name.toLowerCase().includes(query) && !p.mah.toLowerCase().includes(query)) return;

        const color = categoryColors[p.cat] || "#475569";
        const icon = L.divIcon({
          className: 'custom-icon',
          html: `<div class="custom-marker" style="background:${color};"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const m = L.marker([p.lat, p.lng], { icon })
          .bindPopup(`
            <div style="font-size:13px; min-width:180px;">
              <strong style="color:#0f172a; font-size:14px;">${p.name}</strong><br>
              <span style="color:#64748b; font-size:12px;">${p.cat}</span><br>
              <div style="margin-top:4px; color:#334155;">📍 ${p.mah}</div>
              <div style="margin-top:8px; border-top:1px solid #e2e8f0; padding-top:6px;">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" style="color:#2563eb; text-decoration:none; font-weight:600; font-size:12px;">Google Haritalar'da Aç ↗</a>
              </div>
            </div>
          `);
        m.addTo(map);
        activeMarkers.push(m);
      });
    }

    function buildSidebar() {
      const counts = {};
      allPoints.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
      const container = document.getElementById('category-list');
      container.innerHTML = '';

      Object.keys(counts).sort().forEach(cat => {
        const col = categoryColors[cat] || "#475569";
        const div = document.createElement('div');
        div.className = 'cat-item' + (disabledCategories.has(cat) ? ' inactive' : '');
        div.innerHTML = `
          <div class="cat-name">
            <span class="cat-dot" style="background:${col};"></span>
            <span>${cat}</span>
          </div>
          <span class="cat-badge">${counts[cat]}</span>
        `;
        div.onclick = () => {
          if (disabledCategories.has(cat)) disabledCategories.delete(cat);
          else disabledCategories.add(cat);
          buildSidebar();
          renderMarkers();
        };
        container.appendChild(div);
      });
    }

    buildSidebar();
    renderMarkers();
    document.getElementById('search-input').addEventListener('input', renderMarkers);
  </script>
